          npm install
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          mkdir -p assets
          cp icon.png assets/icon-only.png
          cp icon.png assets/splash.png
          npx capacitor-assets generate --android || true
          npx cap sync android

      - name: Build Lightweight APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare Direct APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BedoDrive-BeDoGaming.apk

      - name: Upload Ready-to-Install APK (Actions Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: BedoDrive-BeDoGaming-APK
          path: BedoDrive-BeDoGaming.apk

      - name: Publish APK to GitHub Releases Automatically
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "بيدو درايف (BeDo Gaming APK) — الإصدار v1.0.${{ github.run_number }}"
          body: |
            ### 🎮 بيدو درايف — شوارع مصر (BeDo Gaming)
            تم بناء ملف الـ APK تلقائياً.
            - 📥 **اضغط على `BedoDrive-BeDoGaming.apk` بالأسفل لتحميل اللعبة وتثبيتها مباشرة على موبايلك الأندرويد.**
          files: BedoDrive-BeDoGaming.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
